[project]
name = "rb-client"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ayush Katiyar", email = "ayush24katiyar@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "mss>=10.2.0",
    "pillow>=12.3.0",
    "pynput>=1.8.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
]

[project.scripts]
rb-client = "rb_client:main"

[project.optional-dependencies]
client = [
    "mss>=10.2.0",
    "pynput>=1.8.2",
]

[tool.mypy]
[[tool.mypy.overrides]]
module = ["pynput.*"]
ignore_missing_imports = true


[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
